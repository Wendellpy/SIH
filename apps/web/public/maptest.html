<!DOCTYPE html>
<html>
<head>
  <title>MapLibre 3D Test</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }
    #log { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.8); color: #0f0; font-family: monospace; font-size: 12px; padding: 10px; max-width: 500px; max-height: 300px; overflow-y: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="log"></div>
  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      console.log(msg);
      logEl.innerHTML += msg + '<br>';
      logEl.scrollTop = logEl.scrollHeight;
    }

    log('Starting MapLibre test...');
    log('Origin: ' + window.location.origin);

    const tileUrl = window.location.origin + '/api/tiles/{z}/{x}/{y}';
    log('Tile URL template: ' + tileUrl);

    // First, test if a tile actually loads
    fetch('/api/tiles/14/11506/7311')
      .then(r => {
        log('Test tile fetch: status=' + r.status + ' type=' + r.headers.get('content-type') + ' size=' + r.headers.get('content-length'));
        return r.arrayBuffer();
      })
      .then(buf => {
        log('Test tile buffer size: ' + buf.byteLength + ' bytes');
        log('First bytes: ' + Array.from(new Uint8Array(buf.slice(0, 6))).map(b => b.toString(16).padStart(2,'0')).join(' '));
      })
      .catch(e => log('ERROR fetching test tile: ' + e.message));

    try {
      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          name: 'Mumbai 3D Test',
          glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
          sources: {
            openmaptiles: {
              type: 'vector',
              tiles: [tileUrl],
              minzoom: 0,
              maxzoom: 14,
              bounds: [72.415, 18.466, 73.516, 19.5]
            }
          },
          layers: [
            {
              id: 'background',
              type: 'background',
              paint: { 'background-color': '#070b14' }
            },
            {
              id: 'water',
              type: 'fill',
              source: 'openmaptiles',
              'source-layer': 'water',
              paint: { 'fill-color': '#0284c7', 'fill-opacity': 0.6 }
            },
            {
              id: 'landcover',
              type: 'fill',
              source: 'openmaptiles',
              'source-layer': 'landcover',
              paint: { 'fill-color': '#064e3b', 'fill-opacity': 0.4 }
            },
            {
              id: 'roads',
              type: 'line',
              source: 'openmaptiles',
              'source-layer': 'transportation',
              paint: { 'line-color': '#334155', 'line-width': 1.5 }
            },
            {
              id: '2d-buildings',
              type: 'fill',
              source: 'openmaptiles',
              'source-layer': 'building',
              paint: { 'fill-color': '#0f766e', 'fill-opacity': 0.5 }
            },
            {
              id: '3d-buildings',
              type: 'fill-extrusion',
              source: 'openmaptiles',
              'source-layer': 'building',
              minzoom: 12,
              paint: {
                'fill-extrusion-color': [
                  'case',
                  ['has', 'render_height'],
                  ['interpolate', ['linear'], ['get', 'render_height'],
                    0, '#0ea5e9',
                    25, '#38bdf8',
                    60, '#818cf8',
                    120, '#c084fc',
                    220, '#f43f5e'
                  ],
                  '#38bdf8'
                ],
                'fill-extrusion-height': [
                  'case',
                  ['has', 'render_height'],
                  ['get', 'render_height'],
                  18
                ],
                'fill-extrusion-base': 0,
                'fill-extrusion-opacity': 0.9
              }
            }
          ]
        },
        center: [72.8280, 18.9960],
        zoom: 14.8,
        pitch: 45,
        bearing: -17.5
      });

      map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

      map.on('load', () => log('✅ MAP LOADED SUCCESSFULLY'));
      map.on('error', (e) => log('❌ MAP ERROR: ' + JSON.stringify(e.error || e)));
      map.on('data', (e) => {
        if (e.dataType === 'source' && e.sourceId === 'openmaptiles') {
          log('📦 Source data event: ' + e.sourceId + ' loaded=' + (e.isSourceLoaded || false));
        }
      });
      map.on('idle', () => log('🏁 Map idle (all tiles rendered)'));

      log('Map constructor succeeded');
    } catch(e) {
      log('FATAL: ' + e.message);
    }
  </script>
</body>
</html>
