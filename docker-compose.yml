version: '3.8'

services:
  # 1. PostgreSQL 16 with PostGIS 3.4
  postgis:
    image: postgis/postgis:16-3.4
    container_name: sih-postgis
    environment:
      POSTGRES_DB: dolr_cadastre_3d
      POSTGRES_USER: cadastre_admin
      POSTGRES_PASSWORD: CadastreSecurePassword2026!
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadastre_admin -d dolr_cadastre_3d"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis for BullMQ Async Queues
  redis:
    image: redis:7-alpine
    container_name: sih-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. MinIO (S3-Compatible Object Store)
  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: sih-minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: MinioSecurePassword2026!
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 4. Python FastAPI AI/ML Microservice
  ml-service:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile
    container_name: sih-ml-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - postgis
      - redis

  # 5. NestJS / Express Backend API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sih-api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://cadastre_admin:CadastreSecurePassword2026!@postgis:5432/dolr_cadastre_3d
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
      ml-service:
        condition: service_started

  # 6. Next.js 14 3D Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sih-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000/ws
    depends_on:
      - api

volumes:
  postgis_data:
  redis_data:
  minio_data:
